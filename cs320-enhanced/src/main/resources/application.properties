spring.application.name=cs320-enhanced
server.port=8080

# Secrets come from environment variables, never from source code.
# JWT_SECRET must be at least 32 characters. 
# If it is missing, a random key is generated at startup.
# Tokens stop working after a restart.
app.security.jwt-secret=${JWT_SECRET:}
app.security.token-ttl-minutes=60
# An ADMIN account is only created when both variables are set.
app.security.admin-username=${ADMIN_USERNAME:}
app.security.admin-password=${ADMIN_PASSWORD:}

# Do not leak stack traces or exception messages in error responses
server.error.include-stacktrace=never
server.error.include-message=never

springdoc.swagger-ui.path=/swagger-ui.html
